  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
  .mono tspan, .mono { white-space: pre; }
  text.term-dim { fill: #8b949e; }
  .tagline { opacity: 0; animation: cycle 17.5s infinite; }
  @keyframes cycle { 0% { opacity: 0; transform: translateY(6px); } 2.40% { opacity: 1; transform: none; } 17.60% { opacity: 1; transform: none; } 20.00% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 0; } }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .tagline.first { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
