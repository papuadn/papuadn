<text x="24" y="229" class="label" style="fill:#1ed760">CURRENTLY ›</text>
<text x="116" y="230" font-size="15" class="tagline first" style="animation-delay:0s">shipping Flutter apps after hours, because sleep is overrated</text>
<text x="116" y="230" font-size="15" class="tagline" style="animation-delay:3.5s">starting side project #10 instead of finishing #9</text>
<text x="116" y="230" font-size="15" class="tagline" style="animation-delay:7s">renovating the house, one YouTube tutorial at a time</text>
<text x="116" y="230" font-size="15" class="tagline" style="animation-delay:10.5s">learning guitar. The neighbours are being very brave.</text>
<text x="116" y="230" font-size="15" class="tagline" style="animation-delay:14s">noticing your kerning. Sorry, old designer habit.</text>
